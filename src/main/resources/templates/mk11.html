<!DOCTYPE html>
<!--
  =====================================================================
  NexaActivos - Nexa Servicios S.A.S. · Ingeniería de Software II
  Archivo : src/main/resources/templates/mk11.html
  Capa    : Vista (DDA 3.6 v3_GenC, Tablas 3 y 6)
  MK      : MK-11 Dar de baja activo (aviso de consecuencia) (mockups 2.5, Tablas 23 y 24)
  Controlador: ActivoControlador (darDeBaja)
  HU      : HU-04 · RF-05, RF-57, RF-58, RF-59, RF-164 · CU-04 (no documentado)
  Campos  : datos del activo en solo lectura, recibidos de MK-01 o MK-10:
            Placa_Inventario, Estado, Marca y Modelo.
  Aviso   : M-30 con la placa del activo (RF-59). «Desistir» muestra M-29 en
            la misma Vista, sin llamar al Controlador (como el flujo 7a de
            CU-24 en 3.7); el activo no se modifica.
  Rechazos: M-21, M-31 y M-32 los responde el Servicio al confirmar. En HU-04
            CA-3 y CA-4 la historia pide no mostrar el aviso; aquí el aviso se
            muestra y el rechazo llega al confirmar (ver README, observación
            del corte; el diagrama v6 no tiene un método de prevalidación).
  La Vista no valida RN ni invoca el Modelo. Nunca se borra el registro.
  CRF     : CRF-003 · Línea base: LB-1
  Estado  : corte vertical. Propuesta del equipo, pendiente de validar.
  Versión 1.0 | 06/11/2026 | Julián David Valencia Gamboa; Eliú Marimón Arrieta | Esqueleto inicial (entrega 4.2)
  Versión 1.1 | 06/11/2026 | Julián David Valencia Gamboa; Eliú Marimón Arrieta | HU-04 RF-05: confirmación de la baja y resultado
  Versión 1.2 | 06/11/2026 | Julián David Valencia Gamboa; Eliú Marimón Arrieta | HU-04 RF-59: aviso M-30 y «Desistir» con M-29
  =====================================================================
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>NexaActivos - MK-11 Dar de baja activo (aviso de consecuencia)</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 15px; margin: 24px; }
    .sesion { background: #1F2A5C; color: #fff; padding: 6px 10px; }
    .exito { color: #0b6b2e; font-weight: bold; }
    .error { color: #b00020; font-weight: bold; }
    .info { color: #333; font-style: italic; }
    label { display: inline-block; width: 170px; }
    table { border-collapse: collapse; }
    th { background: #1F2A5C; color: #fff; }
    th, td { border: 1px solid #999; padding: 4px 8px; }
  </style>
</head>
<body>
  <p class="sesion">Usuario en sesión (ID_Usuario):
    <span th:text="${@sesionActual.idUsuario != null ? @sesionActual.idUsuario : 'sin sesión'}">-</span>
    · Rol: <span th:text="${@sesionActual.rol != null ? #strings.replace(@sesionActual.rol.name(), '_', ' ') : 'sin sesión'}">-</span>
    (sesión de prueba, P-62; RNF-02)</p>
  <h1>MK-11 Dar de baja activo</h1>
  <div th:unless="${resultado}" id="aviso">
    <table>
      <tr><th>Placa_Inventario</th><th>Estado</th><th>Marca</th><th>Modelo</th></tr>
      <tr><td th:text="${placa}"></td><td th:text="${estado}"></td><td th:text="${marca}"></td><td th:text="${modelo}"></td></tr>
    </table>
    <p class="info" th:text="${aviso}"></p>
    <form method="post" th:action="@{/activos/{id}/baja(id=${idActivo})}">
      <button type="submit">Confirmar baja</button>
      <button type="button" onclick="document.getElementById('aviso').style.display='none';document.getElementById('desistio').style.display='block';">Desistir</button>
    </form>
  </div>
  <div id="desistio" style="display:none">
    <p class="info" th:text="${m29}"></p>
    <p><a th:href="@{/activos}">Volver a MK-01</a></p>
  </div>
  <div th:if="${resultado}">
    <p th:if="${mensajeExito}" class="exito" th:text="${mensajeExito}"></p>
    <p th:if="${mensajeError}" class="error" th:text="${mensajeError}"></p>
    <p><a th:href="@{/activos}">Volver a MK-01</a></p>
  </div>
</body>
</html>
