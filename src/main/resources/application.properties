# =====================================================================
# NexaActivos · application.properties
# Capa: configuración (diferencia declarada con la Tabla 6 del DDA 3.6
# v3_GenC, que no lista este archivo). CRF-003 · Línea base: LB-1.
# HU: HU-01 a HU-04 (corte); RF-166 transversal (origen HU-38)
# RF: HU-01: RF-01, RF-02, RF-52; HU-02: RF-03, RF-56; HU-03: RF-04, RF-51,
#     RF-53, RF-54, RF-55, RF-60; HU-04: RF-05, RF-57, RF-58, RF-59, RF-164
# CU: CU-01 (Tabla 8 de 3.7); CU-02 a CU-04 (no documentados)
# MK: MK-01, MK-02, MK-10, MK-11
# La clave de la base de datos NO se escribe aquí: se lee de la variable de
# entorno NEXA_DB_PASSWORD (IS2 paso 14). Ver README.md, «Clave de la base
# de datos». Propuesta del equipo, pendiente de validar.
# Versión 1.0 | 06/11/2026 | Julián David Valencia Gamboa; Eliú Marimón Arrieta | Inicial (entrega 4.2)
# Versión 1.1 | 06/11/2026 | Julián David Valencia Gamboa; Eliú Marimón Arrieta | Corte vertical 4.3: modo estricto en cada conexión (D-14) y sesión de prueba (D-11, P-62)
# =====================================================================
spring.application.name=nexaactivos
spring.datasource.url=jdbc:mariadb://localhost:3306/nexaactivos
spring.datasource.username=${NEXA_DB_USER:root}
spring.datasource.password=${NEXA_DB_PASSWORD}

# Modo estricto (D-14): el DDL v1.2 supone un sql_mode con STRICT_TRANS_TABLES.
# Cada conexión nueva del pool lo fija para su sesión; ConexionBD comprueba al
# arrancar que la sesión lo tenga y, si no, detiene la aplicación. Es el
# sql_mode por omisión de MariaDB 10.4.
spring.datasource.hikari.connection-init-sql=SET SESSION sql_mode='STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION'

# Sesión de prueba (D-11): mientras P-62 siga abierta nadie puede iniciar
# sesión. Cada sesión HTTP nueva toma este usuario y este rol, que deben
# coincidir con db/datos_prueba.sql (1 = Responsable de Activos; 2 = Empleado,
# sin permisos). Se cambian sin tocar este archivo con las variables de
# entorno NEXA_SESION_ID_USUARIO y NEXA_SESION_ROL.
nexa.sesion-prueba.habilitada=true
nexa.sesion-prueba.id-usuario=${NEXA_SESION_ID_USUARIO:1}
nexa.sesion-prueba.rol=${NEXA_SESION_ROL:Responsable de Activos}

# Vista: plantillas sin caché para ver los cambios al recargar (desarrollo)
spring.thymeleaf.cache=false
